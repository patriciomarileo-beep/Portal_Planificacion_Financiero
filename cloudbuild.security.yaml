# Run with an existing Artifact Registry repository:
# gcloud builds submit --config cloudbuild.security.yaml --substitutions _IMAGE=REGION-docker.pkg.dev/PROJECT/REPOSITORY/portal:TAG .
# The final image is scanned before it can be pushed. No deployment runs here.
steps:
  - id: application-security
    name: node:22-trixie-slim@sha256:2e40f0b0227d54ea99362e190cc13331f023fc1eef064d3d73d23d9434e8b86f
    entrypoint: bash
    args:
      - -euc
      - |
        npm ci
        npm run audit:production
        npm run test:security:patches
        npm run test:security

  - id: build-image
    name: gcr.io/cloud-builders/docker@sha256:f772ab459889c67835bd959c2b9e9351f2c0752c4f989710ecda20c229f0733e
    args: [build, --pull, --tag, '${_IMAGE}', .]

  - id: save-image
    name: gcr.io/cloud-builders/docker@sha256:f772ab459889c67835bd959c2b9e9351f2c0752c4f989710ecda20c229f0733e
    args: [save, --output, /workspace/security-image.tar, '${_IMAGE}']

  - id: scan-final-image
    name: ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    args: [image, --input, /workspace/security-image.tar, --scanners, vuln, --severity, 'HIGH,CRITICAL', --exit-code, '1', --format, json, --timeout, 10m]

  - id: push-verified-image
    name: gcr.io/cloud-builders/docker@sha256:f772ab459889c67835bd959c2b9e9351f2c0752c4f989710ecda20c229f0733e
    args: [push, '${_IMAGE}']

images: ['${_IMAGE}']
timeout: 1800s
