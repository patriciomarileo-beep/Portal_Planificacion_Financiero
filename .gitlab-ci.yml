include:
  - project: forus-corp/planificacion-comercial/ci-templates
    ref: v2
    file: cloud-run-deploy.yml

stages: [prepare, test, validate, build, deploy]

variables:
  CLOUD_RUN_TYPE: "service"
  CLOUD_RUN_NAME: "plataforma-planificacion-financiera"
  GIT_DEPTH: "0"
  NEXT_TELEMETRY_DISABLED: "1"
  AST_ENABLE_MR_PIPELINES: "true"
  SAST_EXCLUDED_PATHS: "tests,tmp,node_modules,.next,.venv,.gcloud,private-data"

security-regression:
  stage: validate
  image: node:22-trixie-slim@sha256:2e40f0b0227d54ea99362e190cc13331f023fc1eef064d3d73d23d9434e8b86f
  script:
    - npm ci
    - npm run test:security:patches
    - npm run test:security:deployment
    - npm run audit:production
    - npm run test:security
    - npm run test:sales-margin
    - node scripts/test-dollar-history.mjs
    - npm run test:market
    - npm run lint
    - npm run build:cloudrun
    - npm run test:security:http
    - npm run test:security:assets

# Audit the complete locked dependency tree and retain the scanner report.
dependency-audit:
  stage: validate
  image: node:22-trixie-slim@sha256:2e40f0b0227d54ea99362e190cc13331f023fc1eef064d3d73d23d9434e8b86f
  script:
    - npm ci
    - npm audit --json > dependency-audit.json
  allow_failure: true
  artifacts:
    when: always
    paths: [dependency-audit.json]
    expire_in: 30 days

sast-result-gate:
  stage: validate
  image: node:22-trixie-slim@sha256:2e40f0b0227d54ea99362e190cc13331f023fc1eef064d3d73d23d9434e8b86f
  needs:
    - job: semgrep-sast
      artifacts: true
      optional: true
  script:
    - node scripts/check-sast-report.mjs
  allow_failure: true

secret-detection:
  stage: validate
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [""]
  script:
    - gitleaks git --redact=100 --report-format json --report-path secret-detection.json --no-banner .
  artifacts:
    when: always
    paths: [secret-detection.json]
    expire_in: 30 days
